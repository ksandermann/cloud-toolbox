name: Build Images
on:
  push:
    paths-ignore:
      - '.github/workflows/update.yaml'
      - '.github/workflows/verify_tools.yaml'
      - 'verify_tools.sh'
  workflow_dispatch:
concurrency:
  group: cloud-toolbox-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  Prepare:
    runs-on: ubuntu-24.04
    outputs:
      image_tag: ${{ steps.metadata.outputs.image_tag }}
      build_id: ${{ steps.metadata.outputs.build_id }}
      publish_mode: ${{ steps.metadata.outputs.publish_mode }}
    steps:
      - name: Set build metadata
        id: metadata
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          echo "image_tag=$(date -u +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"
          echo "build_id=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == "refs/heads/master" && "$GITHUB_EVENT_NAME" == "push" ]]; then
            echo "publish_mode=release" >> "$GITHUB_OUTPUT"
          else
            echo "publish_mode=test" >> "$GITHUB_OUTPUT"
          fi
  Build-Images:
    timeout-minutes: 360
    needs: Prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      BUILD_ARCH: ${{ matrix.architecture }}
      BUILD_ID: ${{ needs.Prepare.outputs.build_id }}
      IMAGE_TAG: ${{ needs.Prepare.outputs.image_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Set up Trivy
        uses: aquasecurity/setup-trivy@v0.3.1
      - name: Build Images
        run: bash ./build.sh
  Publish-Images:
    needs: [Prepare, Build-Images]
    runs-on: ubuntu-24.04
    env:
      BUILD_ID: ${{ needs.Prepare.outputs.build_id }}
      IMAGE_TAG: ${{ needs.Prepare.outputs.image_tag }}
      PUBLISH_MODE: ${{ needs.Prepare.outputs.publish_mode }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Publish and verify multi-platform tags
        run: bash ./publish.sh
  Create-Release:
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    needs: [Prepare, Publish-Images]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      RELEASE_DATE: ${{ needs.Prepare.outputs.image_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate Release Notes from changes
        run: |
          {
            echo "$RELEASE_DATE"
            echo
            echo "Changelog"
            changes=$(git diff HEAD^ HEAD -- args_base.args args_optional.args | grep -E '^\+[^+].*=' || true)
            if [[ -n "$changes" ]]; then
              printf '%s\n' "$changes" | sed 's/^+/- /'
            else
              echo "- No version changes detected."
            fi
          } > release_notes.md
      - name: Display Release Notes
        run: cat release_notes.md
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_DATE }}
          name: Release ${{ env.RELEASE_DATE }}
          body_path: release_notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}