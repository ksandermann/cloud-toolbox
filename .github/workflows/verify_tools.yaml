name: Verify Tools
run-name: ${{ github.actor }} is verifying toolbox images
on:
  workflow_run:
    workflows: ["Build Images"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      build_id:
        description: "Optional run ID-attempt for test tags, for example 37670718556-1"
        required: false
        type: string
permissions:
  contents: read
jobs:
  Resolve-Target:
    runs-on: ubuntu-24.04
    outputs:
      build_id: ${{ steps.target.outputs.build_id }}
    steps:
      - name: Resolve image build ID
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          INPUT_BUILD_ID: ${{ inputs.build_id }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            if [[ "$RUN_BRANCH" == "master" && "$RUN_EVENT" == "push" ]]; then
              BUILD_ID=""
            else
              BUILD_ID="${RUN_ID}-${RUN_ATTEMPT}"
            fi
          else
            BUILD_ID="$INPUT_BUILD_ID"
          fi
          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"
  Verify-Tools:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    needs: Resolve-Target
    timeout-minutes: 60
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: latest
            platform: linux/amd64
            runner: ubuntu-24.04
          - image: latest
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - image: complete
            platform: linux/amd64
            runner: ubuntu-24.04
          - image: complete
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - name: Pull and verify tools
        env:
          IMAGE_NAME: ${{ matrix.image }}
          IMAGE_PLATFORM: ${{ matrix.platform }}
          TEST_BUILD_ID: ${{ needs.Resolve-Target.outputs.build_id }}
        run: |
          image_tag="$IMAGE_NAME"
          if [[ -n "$TEST_BUILD_ID" ]]; then
            image_tag="test-${TEST_BUILD_ID}-${IMAGE_NAME}"
          fi
          image="ksandermann/cloud-toolbox:${image_tag}"
          if [[ "$IMAGE_NAME" == "complete" ]]; then MODE=complete; else MODE=base; fi

          docker pull --platform "$IMAGE_PLATFORM" "$image"
          docker run --rm \
            --platform "$IMAGE_PLATFORM" \
            -e "MODE=$MODE" \
            -v "$PWD:/repo:ro" \
            -w /repo \
            "$image" \
            bash verify_tools.sh
