name: update - versions
run-name: update - versions (${{ github.event_name == 'workflow_dispatch' && 'manual' || github.event_name }})
on:
  schedule:
    #UTC - https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#schedule
    - cron: '20 3 * * MON'
    - cron: '20 3 * * FRI'
  workflow_dispatch:
concurrency:
  group: update-versions
  cancel-in-progress: false
permissions:
  contents: write
  pull-requests: write
jobs:
  # Single job: hosted runners do not share a workspace between jobs.
  Update-Versions:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
      - name: Set release date and branch
        run: |
          echo "RELEASE_DATE=$(date --rfc-3339=date)" >> "$GITHUB_ENV"
          echo "BRANCH=$(date --rfc-3339=date)_automation" >> "$GITHUB_ENV"
      - name: Create branch
        run: git checkout -B "$BRANCH"
      - name: Update versions
        run: bash update_versions.sh
      - name: Commit
        run: |
          git config --local user.email "kevin.sandermann@gmail.com"
          git config --local user.name "github-actions[bot]"
          git commit --allow-empty -a -m "Release ${RELEASE_DATE}"
      - name: Push branch
        # The branch is bot-owned and rebuilt from master on every run.
        run: git push --force origin "$BRANCH"
      - name: Create PR
        run: |
          {
            echo "# Changelog"
            echo ""
            if [[ -s changed_versions.txt ]]; then
              cat changed_versions.txt
            else
              echo "(no version changes)"
            fi
          } > pr_body.md
          if [[ -n "$(gh pr list --head "$BRANCH" --base master --state open --json number --jq '.[].number')" ]]; then
            echo "PR for $BRANCH already open, branch updated."
          else
            gh pr create --base master --head "$BRANCH" --title "Release ${RELEASE_DATE}" --body-file pr_body.md
          fi
